<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job-Pilot AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0F172A;
      color: #F1F5F9;
      width: 380px;
      min-height: 480px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1E293B, #1E1B4B);
      padding: 20px 20px 16px;
      border-bottom: 1px solid #334155;
    }
    .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .app-name { font-size: 16px; font-weight: 700; color: #F1F5F9; }
    .app-subtitle { font-size: 11px; color: #6366F1; font-weight: 500; }

    /* URL display */
    .url-box {
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      color: #94A3B8;
      word-break: break-all;
      max-height: 48px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main content */
    .content { padding: 20px; }

    /* Status badge */
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px; font-weight: 600;
      margin-bottom: 16px;
    }
    .status-badge.supported { background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.3); }
    .status-badge.unsupported { background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.3); }

    /* Save button */
    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    }
    .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Feedback states */
    .feedback {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .feedback.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #10B981; display: block; }
    .feedback.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #EF4444; display: block; }

    /* Notes field */
    .field-label { font-size: 12px; font-weight: 600; color: #94A3B8; margin-bottom: 6px; }
    textarea {
      width: 100%;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 10px 12px;
      resize: none;
      height: 72px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: #6366F1; }

    /* Login prompt */
    .login-prompt {
      text-align: center;
      padding: 24px;
    }
    .login-prompt p { color: #94A3B8; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
    .open-btn {
      background: transparent;
      border: 1px solid #6366F1;
      color: #6366F1;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .open-btn:hover { background: rgba(99,102,241,0.1); }

    /* Processing animation */
    .processing {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px; gap: 12px; display: none;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #334155;
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { height: 1px; background: #1E293B; margin: 16px 0; }
    .footer { padding: 12px 20px; border-top: 1px solid #1E293B; display: flex; justify-content: space-between; align-items: center; }
    .footer-link { font-size: 11px; color: #64748B; cursor: pointer; text-decoration: none; }
    .footer-link:hover { color: #6366F1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo">🚀</div>
      <div>
        <div class="app-name">Job-Pilot AI</div>
        <div class="app-subtitle">Powered by Gemini 1.5 Flash</div>
      </div>
    </div>
    <div class="url-box" id="currentUrl">Loading...</div>
  </div>

  <div class="content" id="mainContent">
    <!-- Auth check state -->
    <div id="authPrompt" class="login-prompt" style="display:none;">
      <p>Sign in to Job-Pilot AI to save jobs from any job board.</p>
      <button class="open-btn" id="openAppBtn">Open Job-Pilot AI →</button>
    </div>

    <!-- Logged in state -->
    <div id="loggedInContent" style="display:none;">
      <div id="statusBadge" class="status-badge supported">
        <span>✓</span> <span id="statusText">Supported job board</span>
      </div>

      <div class="field-label">Notes (optional)</div>
      <textarea id="noteInput" placeholder="Initial thoughts about this role..."></textarea>

      <button class="save-btn" id="saveBtn">
        <span>🤖</span>
        <span>Save & Extract with AI</span>
      </button>

      <div id="processingDiv" class="processing">
        <div class="spinner"></div>
        <span style="color:#94A3B8; font-size:13px;">Saving to Job-Pilot AI...</span>
      </div>

      <div id="feedbackDiv" class="feedback"></div>
    </div>
  </div>

  <div class="footer">
    <a href="#" class="footer-link" id="openDashboard">Open Dashboard ↗</a>
    <span style="font-size:11px; color:#64748B;">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
